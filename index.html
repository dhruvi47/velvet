<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Velvet's Birthday</title>
    <style>
        body { font-family: 'Georgia', serif; text-align: center; background: #fcf8f2; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; margin: 0; position: relative; }
        
        #global-bg { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; opacity: 0.15; background-size: cover; background-position: center; }

        .content-wrapper { position: relative; z-index: 10; background: rgba(255,255,255,0.85); padding: 40px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); backdrop-filter: blur(5px); }

        .btn { padding: 15px 30px; margin: 10px; font-size: 1.2rem; cursor: pointer; border: 2px solid #333; background: #fff; border-radius: 8px; transition: 0.3s; font-weight: bold; width: 80%; max-width: 300px; }
        .btn:hover { background: #333; color: #fff; transform: scale(1.05); }
        
        #modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); align-items: center; justify-content: center; z-index: 100; backdrop-filter: blur(5px); }
        .modal-content { background: #fff; padding: 40px; border-radius: 15px; text-align: center; width: 90%; max-width: 400px; box-shadow: 0 10px 40px rgba(0,0,0,0.3); }
        input { padding: 10px; font-size: 1.2rem; width: 80%; margin-top: 20px; border: 2px solid #333; border-radius: 5px; text-align: center; outline: none; }
        input:focus { border-color: #8b7355; }

        .audio-ctrl { position: fixed; bottom: 20px; right: 20px; background: rgba(255,255,255,0.9); padding: 10px 15px; border-radius: 30px; z-index: 100; box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: flex; align-items: center; gap: 10px; border: 1px solid #ddd; }
        input[type="range"] { accent-color: #8b7355; cursor: pointer; }
    </style>
</head>
<body>
        <!-- 10-Second Global Skip -->
    <button id="global-skip" onclick="window.location.href='hub.html'" style="position: fixed; bottom: 20px; left: 20px; padding: 12px 20px; background: rgba(0,0,0,0.7); color: #fff; border: 2px solid #fff; border-radius: 30px; font-weight: bold; cursor: pointer; z-index: 9999; display: none; box-shadow: 0 4px 10px rgba(0,0,0,0.3);">Skip ⏭️</button>

    <script>
        setTimeout(() => {
            document.getElementById('global-skip').style.display = 'block';
        }, 1000);
    </script>
    <div id="global-bg"></div>

    <div class="audio-ctrl">
        <span id="mute-btn" onclick="toggleMute('bgm')" style="cursor:pointer">🔊</span>
        <input type="range" min="0" max="1" step="0.05" value="0.5" oninput="changeVol('bgm', this.value)">
    </div>
    <audio id="bgm" autoplay loop><source src="aesthetic.mp3" type="audio/mpeg"></audio>

    <div class="content-wrapper">
        <h1 style="color: #333; margin-bottom: 30px;">How much u like dhruva?</h1>
        <a href="poster.html"><button class="btn">Itna sa</button></a>
        <button class="btn" onclick="document.getElementById('modal').style.display='flex'">Hold ma hand</button>
    </div>

    <div id="modal">
        <div class="modal-content">
            <h2 style="color: #8b7355;">Prove it.</h2>
            <p style="font-weight: bold; color: #555;">What is his favorite anime?</p>
            <input type="text" id="animeInput" placeholder="Type here...">
            <br><br>
            <button class="btn" onclick="checkPassword()">Submit</button>
            <p id="errorMsg" style="color: red; display: none; font-weight: bold;">Wrong answer, try again!</p>
        </div>
    </div>

    <script>
        document.getElementById('global-bg').style.backgroundImage = `url('couple${Math.floor(Math.random() * 5) + 1}.jpg')`;

        function checkPassword() {
            const ans = document.getElementById('animeInput').value.toLowerCase().trim();
            if (ans === 'naruto') {
                window.location.href = 'hub.html';
            } else {
                document.getElementById('errorMsg').style.display = 'block';
            }
        }

        function toggleMute(id) {
            let audio = document.getElementById(id);
            audio.muted = !audio.muted;
            document.getElementById('mute-btn').innerText = audio.muted ? '🔇' : '🔊';
        }
        function changeVol(id, val) { document.getElementById(id).volume = val; }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose Your Journey</title>
    <style>
        body { font-family: 'Georgia', serif; text-align: center; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; margin: 0; overflow: hidden; background: #000; }
        
        /* Smooth Double-Layer Background System */
        #bg-layer-1, #bg-layer-2 { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -3; background-size: cover; background-position: center; transition: opacity 2s ease-in-out; }
        #bg-layer-2 { opacity: 0; }
        
        /* The Tint Overlay to change vibe on hover */
        #vibe-tint { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -2; background: rgba(252, 248, 242, 0.85); transition: background 0.8s ease; }
        
        #carousel-text { position: fixed; top: 12%; width: 100%; text-align: center; font-size: clamp(2rem, 5vw, 3.5rem); color: rgba(0,0,0,0.7); font-family: 'Georgia', serif; font-style: italic; z-index: -1; text-shadow: 0 0 20px #fff; transition: opacity 1s; }

        .content { z-index: 10; background: rgba(255, 255, 255, 0.95); padding: 40px 20px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); width: 90%; max-width: 500px; backdrop-filter: blur(5px); }
        .btn { padding: 15px 30px; margin: 15px; font-size: 1.2rem; cursor: pointer; border: 2px solid #333; background: #fff; border-radius: 8px; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); font-weight: bold; width: 80%; display: inline-block; text-decoration: none; color: #333; }
        
        /* Specific Button Hover Styles */
        .btn-sweet:hover { background: #8b7355; color: #fff; border-color: #8b7355; transform: scale(1.05); }
        .btn-chaotic { border-color: #ff007f; color: #ff007f; }
        .btn-chaotic:hover { background: #ff007f; color: #fff; transform: scale(1.05) rotate(-2deg); }
        
        h2 { font-size: 2rem; color: #333; margin-bottom: 20px; }
        
        .audio-ctrl { position: fixed; bottom: 20px; right: 20px; background: rgba(255,255,255,0.9); padding: 10px 15px; border-radius: 30px; z-index: 100; box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: flex; align-items: center; gap: 10px; border: 1px solid #ddd; }
        input[type="range"] { accent-color: #8b7355; cursor: pointer; }
    </style>
</head>
<body>
    <div id="bg-layer-1"></div>
    <div id="bg-layer-2"></div>
    <div id="vibe-tint"></div>
    <div id="carousel-text"></div>

    <div class="content">
        <h2>Choose Your Journey</h2>
        <a href="memory_match.html" class="btn btn-sweet" onmouseover="setVibe('sweet')" onmouseleave="resetVibe()">Sweet & Aesthetic</a>
        <a href="flappy_squirrel.html" class="btn btn-chaotic" onmouseover="setVibe('chaotic')" onmouseleave="resetVibe()">Funny & Chaotic</a>
    </div>

    <div class="audio-ctrl">
        <span id="mute-btn" onclick="toggleMute('bgm')" style="cursor:pointer">🔊</span>
        <input type="range" min="0" max="1" step="0.05" value="0.5" oninput="changeVol('bgm', this.value)">
    </div>
    <audio id="bgm" autoplay loop><source src="aesthetic.mp3" type="audio/mpeg"></audio>

    <script>
        const slides = [
            { img: 'couple1.jpg', text: '5 minutes aur?' },
            { img: 'couple2.jpg', text: 'Stay on call na ..' },
            { img: 'couple3.jpg', text: 'Will u dance with me?' },
            { img: 'couple4.jpg', text: 'Just a little longer' },
            { img: 'couple5.jpg', text: 'Don\'t miss me' },
            { img: 'solo1.jpg', text: 'KOHLI KUTTA' } 
        ];
        
        let currentSlide = 0;
        let activeLayer = 1;

        function updateCarousel() {
            const l1 = document.getElementById('bg-layer-1');
            const l2 = document.getElementById('bg-layer-2');
            const txt = document.getElementById('carousel-text');
            
            const nextSlide = slides[currentSlide];
            
            // Crossfade Logic
            if (activeLayer === 1) {
                l2.style.backgroundImage = `url('${nextSlide.img}')`;
                l2.style.opacity = 1; l1.style.opacity = 0;
                activeLayer = 2;
            } else {
                l1.style.backgroundImage = `url('${nextSlide.img}')`;
                l1.style.opacity = 1; l2.style.opacity = 0;
                activeLayer = 1;
            }

            txt.style.opacity = 0;
            setTimeout(() => {
                txt.innerText = nextSlide.text;
                if (currentSlide === 6) { // KOHLI KUTTA
                    txt.style.color = "rgba(255,0,0,0.8)";
                    txt.style.fontWeight = "bold";
                    txt.style.fontStyle = "normal";
                } else {
                    txt.style.color = "rgba(0,0,0,0.7)";
                    txt.style.fontWeight = "normal";
                    txt.style.fontStyle = "italic";
                }
                txt.style.opacity = 1;
            }, 500);

            currentSlide = (currentSlide + 1) % slides.length;
        }
        
        // Initial setup and interval
        document.getElementById('bg-layer-1').style.backgroundImage = `url('${slides[0].img}')`;
        updateCarousel();
        setInterval(updateCarousel, 4000);

        // Vibe Changes
        function setVibe(type) {
            const tint = document.getElementById('vibe-tint');
            if(type === 'sweet') tint.style.background = 'rgba(234, 224, 213, 0.7)';
            if(type === 'chaotic') tint.style.background = 'rgba(255, 235, 59, 0.7)'; // Bright Yellow tint
        }
        function resetVibe() { 
            document.getElementById('vibe-tint').style.background = 'rgba(252, 248, 242, 0.85)'; 
        }

        // Audio
        function toggleMute(id) {
            let audio = document.getElementById(id);
            audio.muted = !audio.muted;
            document.getElementById('mute-btn').innerText = audio.muted ? '🔇' : '🔊';
        }
        function changeVol(id, val) { document.getElementById(id).volume = val; }
    </script>
</body>
</html>

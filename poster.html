<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Velvet</title>
    <style>
        body { margin: 0; height: 100vh; background: linear-gradient(135deg, rgba(44, 62, 80, 0.9), rgba(76, 161, 175, 0.9)); display: flex; align-items: center; justify-content: center; text-align: center; font-family: 'Georgia', serif; color: #fff; overflow: hidden; position: relative; }
        
        #global-bg { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; opacity: 0.15; background-size: cover; background-position: center; }

        .poster { border: 10px solid #d4af37; padding: 50px 30px; background: rgba(0,0,0,0.6); border-radius: 15px; box-shadow: 0 0 40px rgba(0,0,0,0.8); width: 85%; max-width: 600px; position: relative; z-index: 10; backdrop-filter: blur(3px); }
        h1 { font-size: clamp(2rem, 5vw, 3rem); color: #d4af37; text-transform: uppercase; letter-spacing: 2px; }
        p { font-size: clamp(1.2rem, 3vw, 1.5rem); font-style: italic; }
        .scales { font-size: 5rem; margin: 20px 0; }
        .back-btn { margin-top: 30px; padding: 12px 25px; font-size: 1.1rem; background: #d4af37; color: #111; border: none; border-radius: 5px; cursor: pointer; text-decoration: none; display: inline-block; font-weight: bold; transition: 0.2s; }
        .back-btn:hover { background: #fff; transform: scale(1.05); }

        .audio-ctrl { position: fixed; bottom: 20px; right: 20px; background: rgba(0,0,0,0.8); border: 2px solid #d4af37; padding: 10px 15px; border-radius: 30px; z-index: 100; display: flex; align-items: center; gap: 10px; color: #fff; }
        input[type="range"] { accent-color: #d4af37; cursor: pointer; }
    </style>
</head>
<body>
    <div id="global-bg"></div>

    <div class="audio-ctrl">
        <span id="mute-btn" onclick="toggleMute('bgm')" style="cursor:pointer">🔊</span>
        <input type="range" min="0" max="1" step="0.05" value="0.5" oninput="changeVol('bgm', this.value)">
    </div>
    <audio id="bgm" autoplay loop><source src="aesthetic.mp3" type="audio/mpeg"></audio>

    <div class="poster">
        <div class="scales">⚖️</div>
        <h1>Happy Birthday,<br>Velvet Noir</h1>
        <p>A brilliant lawyer, a fitness enthusiast, and the best squirrel.</p>
        <a href="index.html" class="back-btn">Go back & hold ma hand</a>
    </div>

    <script>
        document.getElementById('global-bg').style.backgroundImage = `url('couple${Math.floor(Math.random() * 5) + 1}.jpg')`;

        function toggleMute(id) {
            let audio = document.getElementById(id);
            audio.muted = !audio.muted;
            document.getElementById('mute-btn').innerText = audio.muted ? '🔇' : '🔊';
        }
        function changeVol(id, val) { document.getElementById(id).volume = val; }
    </script>
</body>
</html>
